<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter - Alertas de Preço</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{hunter:"#ffcc00"},fontFamily:{sans:["Inter","system-ui","sans-serif"]}}}}</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:"Inter",system-ui,sans-serif;background-image:url("img/im2.jpg");background-size:cover;background-position:center;background-attachment:fixed;}</style>
</head>
<body class="text-white min-h-screen">
<div class="min-h-screen bg-black/65 flex flex-col">
    <nav class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-amber-400 font-bold text-xl"><i class="bi bi-bullseye text-2xl"></i> Hunter</a>
            <div class="hidden md:flex items-center gap-5 text-sm font-medium text-gray-300">
                <a href="index.html" class="hover:text-amber-400 transition-colors"><i class="bi bi-house mr-1"></i>Início</a>
                <a href="buscar.html" class="hover:text-amber-400 transition-colors"><i class="bi bi-search mr-1"></i>Buscar</a>
                <a href="alertas.html" class="text-amber-400 font-semibold"><i class="bi bi-bell mr-1"></i>Alertas</a>
                <a href="feedback.html" class="hover:text-amber-400 transition-colors"><i class="bi bi-chat-dots mr-1"></i>Feedback</a>
                <a href="configurar.html" class="hover:text-amber-400 transition-colors"><i class="bi bi-gear mr-1"></i>Configurações</a>
                <a id="loginNav" href="login.html" class="bg-amber-400 hover:bg-amber-300 text-black font-semibold px-4 py-1.5 rounded-full transition-colors"><i class="bi bi-box-arrow-in-right mr-1"></i>Login</a>
                <a id="logoutNav" href="#" class="hidden hover:text-amber-400 transition-colors"><i class="bi bi-box-arrow-right mr-1"></i>Sair</a>
            </div>
            <button id="navToggle" class="md:hidden text-gray-300 text-2xl hover:text-amber-400"><i class="bi bi-list"></i></button>
        </div>
        <div id="mobileMenu" class="hidden md:hidden bg-black/95 border-t border-white/10 px-4 py-4 flex flex-col gap-3 text-sm text-gray-300">
            <a href="index.html" class="hover:text-amber-400 py-1"><i class="bi bi-house mr-2"></i>Início</a>
            <a href="buscar.html" class="hover:text-amber-400 py-1"><i class="bi bi-search mr-2"></i>Buscar</a>
            <a href="alertas.html" class="hover:text-amber-400 py-1 text-amber-400"><i class="bi bi-bell mr-2"></i>Alertas</a>
            <a href="feedback.html" class="hover:text-amber-400 py-1"><i class="bi bi-chat-dots mr-2"></i>Feedback</a>
            <a href="configurar.html" class="hover:text-amber-400 py-1"><i class="bi bi-gear mr-2"></i>Configurações</a>
            <a id="loginNavMobile" href="login.html" class="hover:text-amber-400 py-1"><i class="bi bi-box-arrow-in-right mr-2"></i>Login</a>
            <a id="logoutNavMobile" href="#" class="hidden hover:text-amber-400 py-1"><i class="bi bi-box-arrow-right mr-2"></i>Sair</a>
        </div>
    </nav>

    <main class="flex-1 max-w-2xl mx-auto w-full px-4 py-12">
        <!-- FORM CARD -->
        <div class="bg-zinc-900/90 backdrop-blur-sm border border-zinc-700 rounded-2xl p-8 shadow-2xl mb-8">
            <h2 class="text-2xl font-bold text-amber-400 mb-2 flex items-center gap-2"><i class="bi bi-bell-plus"></i> Criar Alerta de Preço</h2>
            <p class="text-gray-400 text-sm mb-7">Defina o produto e o preço alvo. Você será avisado quando chegar lá.</p>
            <form id="alertForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Nome do Produto</label>
                    <input type="text" id="produto" placeholder="Ex: RTX 4070, iPhone 15..." required
                        class="w-full bg-zinc-800 border border-zinc-600 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent placeholder-gray-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Preço Alvo (R$)</label>
                    <input type="number" id="preco" placeholder="0.00" required min="0.01" step="0.01"
                        class="w-full bg-zinc-800 border border-zinc-600 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent placeholder-gray-500 transition">
                </div>
                <div id="alertMsg" class="hidden text-sm rounded-lg px-4 py-2"></div>
                <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold py-3 rounded-xl transition-all hover:scale-[1.02]">
                    <i class="bi bi-check-circle mr-2"></i>Criar Alerta
                </button>
            </form>
        </div>

        <!-- LISTA DE ALERTAS -->
        <div class="bg-zinc-900/90 backdrop-blur-sm border border-zinc-700 rounded-2xl p-8 shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i class="bi bi-list-check text-amber-400"></i> Meus Alertas</h3>
            <div id="alertList" class="space-y-3">
                <p class="text-gray-500 text-sm text-center py-4" id="alertEmpty">Carregando alertas...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/10 py-6 text-center bg-black/40">
        <p class="text-gray-500 text-sm">&copy; 2025 Hunter - Caçador de Preços</p>
    </footer>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
<script>new window.VLibras.Widget("https://vlibras.gov.br/app");</script>

<script>
    const API_URL = "http://localhost:8000";
    const token = localStorage.getItem("token");

    document.getElementById("navToggle").addEventListener("click",()=>{document.getElementById("mobileMenu").classList.toggle("hidden");});

    if (token) {
        document.getElementById("loginNav")?.classList.add("hidden");
        document.getElementById("logoutNav")?.classList.remove("hidden");
        document.getElementById("loginNavMobile")?.classList.add("hidden");
        document.getElementById("logoutNavMobile")?.classList.remove("hidden");
    }
    function doLogout(e){e?.preventDefault();localStorage.removeItem("token");window.location.href="index.html";}
    document.getElementById("logoutNav")?.addEventListener("click",doLogout);
    document.getElementById("logoutNavMobile")?.addEventListener("click",doLogout);

    function showMsg(msg, isError=false) {
        const el = document.getElementById("alertMsg");
        el.textContent = msg;
        el.className = `text-sm rounded-lg px-4 py-2 ${isError ? "text-red-400 bg-red-400/10 border border-red-400/30" : "text-green-400 bg-green-400/10 border border-green-400/30"}`;
        el.classList.remove("hidden");
        setTimeout(()=>el.classList.add("hidden"), 4000);
    }

    async function carregarAlertas() {
        if (!token) {
            document.getElementById("alertEmpty").textContent = "Faça login para ver seus alertas.";
            return;
        }
        try {
            const r = await fetch(`${API_URL}/alertas`, { headers: { "Authorization": `Bearer ${token}` } });
            const alertas = await r.json();
            const list = document.getElementById("alertList");
            if (!Array.isArray(alertas) || alertas.length === 0) {
                list.innerHTML = "<p class=\"text-gray-500 text-sm text-center py-4\">Nenhum alerta criado ainda.</p>";
                return;
            }
            list.innerHTML = alertas.map(a => `
                <div class="flex items-center justify-between bg-zinc-800/60 border border-zinc-700 rounded-xl px-4 py-3 gap-4" id="alerta-${a.id}">
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-medium truncate">${a.produto}</p>
                        <p class="text-amber-400 text-sm font-bold">${Number(a.preco).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</p>
                    </div>
                    <button onclick="deletarAlerta(${a.id})" class="text-red-400 hover:text-red-300 hover:bg-red-400/10 p-2 rounded-lg transition-colors flex-shrink-0">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>`).join("");
        } catch(e) {
            document.getElementById("alertEmpty").textContent = "Erro ao carregar alertas.";
        }
    }

    async function deletarAlerta(id) {
        if (!confirm("Remover este alerta?")) return;
        try {
            const r = await fetch(`${API_URL}/alerta/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
            if (!r.ok) throw new Error();
            document.getElementById(`alerta-${id}`)?.remove();
            showMsg("Alerta removido com sucesso!");
        } catch(e) { showMsg("Erro ao remover alerta.", true); }
    }

    document.getElementById("alertForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!token) { showMsg("Faça login para criar alertas.", true); window.location.href = "login.html"; return; }
        const produto = document.getElementById("produto").value.trim();
        const preco = parseFloat(document.getElementById("preco").value);
        try {
            const r = await fetch(`${API_URL}/alerta-preco`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ produto, preco })
            });
            if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.detail || "Erro ao criar alerta"); }
            showMsg("Alerta criado com sucesso!");
            document.getElementById("alertForm").reset();
            carregarAlertas();
        } catch(e) { showMsg(e.message, true); }
    });

    carregarAlertas();
</script>
</body>
</html>
